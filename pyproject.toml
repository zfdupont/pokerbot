[project]
name = "pokerbot"
version = "0.1.0"
description = "Texas Hold'em poker simulator with pluggable agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cython>=3.2.8",
    "numpy>=1.26",
    "setuptools>=82.0.1",
    "tomli>=2.0; python_version < '3.11'",
    "tqdm>=4.66",
    "websockets>=12.0",
]

[dependency-groups]
dev = ["pytest>=9.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
