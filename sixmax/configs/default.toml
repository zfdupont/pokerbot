[actions.blueprint]
preflop_opens = [ { size = 2.5, unit = "bb" },
                  { size = 3.5, unit = "bb" },
                  { size = 5.0, unit = "bb" } ]
# Every raise after the open (3-bet+, and ALL postflop bets and raises)
# shares one pot-fraction grid. Raise-to = current_bet + size * (pot + 2*to_call).
bet_sizes     = [ { size = 0.33, unit = "pot" },
                  { size = 0.75, unit = "pot" },
                  { size = 1.5,  unit = "pot" } ]   # includes overbet
include_allin = true   # legal jam always in the action set, incl. preflop

[actions.search]       # may differ from blueprint; v1 is byte-identical so the
                       # checkpoint's vocab hash matches and masks align.
preflop_opens = [ { size = 2.5, unit = "bb" },
                  { size = 3.5, unit = "bb" },
                  { size = 5.0, unit = "bb" } ]
bet_sizes     = [ { size = 0.33, unit = "pot" },   # enriching this later is a
                  { size = 0.75, unit = "pot" },   # config edit + A/B, not an
                  { size = 1.5,  unit = "pot" } ]  # architecture change
include_allin = true   # a search grid without the jam cannot express stack-offs

[search]
enabled      = false      # off by default; the A/B gate decides deployment
budget_ms    = 5000.0
max_nodes    = 20000
max_iters    = 2000
leaf_samples = 256
seed         = 1
leaf_threads = 0           # leaf-matrix worker threads; 0 = all cores
narrow_preflop  = true     # feed the preflop line into the opponent range
prune_keep_mass = 0.99     # keep the top-99% mass band; 1.0 disables pruning

[abstraction]
flop_buckets = 50
turn_buckets = 50
river_buckets = 20
equity_rollouts = 100
quantile_samples = 10000
seed = 20260719

[train.blueprint]
num_players = 6
starting_stack = 100.0
iterations = 100000
num_threads = 0          # 0 = hardware_concurrency
checkpoint_interval = 0  # 0 = save at the end only
checkpoint = "sixmax/checkpoints/blueprint.bin"
seed = 7
selection_enabled = false
selection_hands = 2000

[train.dream]
hidden_size    = 256
hidden_layers  = 3
lr             = 1e-3
batch_size     = 4096
reservoir_size = 2_000_000
train_interval = 10_000
sgd_steps      = 2_000
epsilon        = 0.06
num_threads    = 0        # 0 = hardware_concurrency
seed           = 42
stack_min      = 20.0
stack_max      = 250.0
stack_log_mean = 4.605    # ln(100)
stack_log_std  = 0.5
players_min    = 2
players_max    = 6
device         = "cpu"    # "mps" for MacBook, "cuda" for cloud
checkpoint_interval = 0   # 0 = save at end only
checkpoint     = "sixmax/checkpoints/dream.pt"
