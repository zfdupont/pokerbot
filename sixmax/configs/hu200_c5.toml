# Heads-up (2-player) 200 BB map-backed blueprint training config, arm C5.
#   uv run python scripts/train_sixmax.py --config sixmax/configs/hu200_c5.toml
# C4 (pot edges 3/6/12/24/48/96/192, opens 2/3.5/5 BB, map pct 50/50/20) with
# exactly one change: [abstraction].bet_history = "last_raise", so the size
# class of the last bet or raise on each street joins the infoset key (bits
# 30-41). The vocabulary below is byte-identical to C4's, so the vocab hash
# matches and head-to-head against C4 needs no action translation. C5
# checkpoints are SIXBP004 and must be loaded with this config.

[actions.blueprint]
preflop_opens = [ { size = 2.0, unit = "bb" },
                  { size = 3.5, unit = "bb" },
                  { size = 5.0, unit = "bb" } ]
# Every raise after the open (3-bet+, and ALL postflop bets and raises)
# shares one pot-fraction grid. Raise-to = current_bet + size * (pot + 2*to_call).
bet_sizes     = [ { size = 0.33, unit = "pot" },
                  { size = 0.75, unit = "pot" },
                  { size = 1.5,  unit = "pot" } ]   # includes overbet
include_allin = true   # legal jam always in the action set, incl. preflop

[actions.search]       # may differ from blueprint; v1 is byte-identical so the
                       # checkpoint's vocab hash matches and masks align.
preflop_opens = [ { size = 2.0, unit = "bb" },
                  { size = 3.5, unit = "bb" },
                  { size = 5.0, unit = "bb" } ]
bet_sizes     = [ { size = 0.33, unit = "pot" },
                  { size = 0.75, unit = "pot" },
                  { size = 1.5,  unit = "pot" } ]
include_allin = true

[search]
enabled      = false      # off by default; the A/B gate decides deployment
budget_ms    = 5000.0
max_nodes    = 20000
max_iters    = 2000
leaf_samples = 256
seed         = 1
leaf_threads = 0           # leaf-matrix worker threads; 0 = all cores
narrow_preflop  = true     # feed the preflop line into the opponent range
prune_keep_mass = 0.99     # keep the top-99% mass band; 1.0 disables pruning

[abstraction]
bucket_map = "sixmax/tables/map_pct_50_50_20.bin"
pot_edges = [3.0, 6.0, 12.0, 24.0, 48.0, 96.0, 192.0]
bet_history = "last_raise"   # opt-in last-raise class per street;
                             # requires this bucket map (SIXBP004)
# Ignored when bucket_map is set (the map header defines the buckets); kept so
# this file documents the legacy path it replaces.
flop_buckets = 50
turn_buckets = 50
river_buckets = 20
equity_rollouts = 100
quantile_samples = 10000
seed = 20260719

[train.blueprint]
num_players = 2
starting_stack = 200.0   # this is what 200 BB training means (leak-C frame)
iterations = 60000000
num_threads = 0          # 0 = hardware_concurrency
checkpoint_interval = 5000000   # snapshot every 5M iters (plateau curve)
checkpoint = "sixmax/checkpoints/hu200_c5.bin"
seed = 7
selection_enabled = false
selection_hands = 2000
report_interval = 60
snapshots = true         # keep a distinct <base>_<iters>.bin per save
