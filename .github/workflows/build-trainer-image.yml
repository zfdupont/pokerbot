name: build-trainer-image

# Builds and pushes the CPU sixmax-trainer image on a native amd64 runner.
# This exists because the newer buck2 `latest` binary SIGILLs under QEMU x86
# emulation on arm64 macOS — so the image cannot be built locally on an Apple
# Silicon Mac. GitHub's ubuntu-latest runners are amd64, so buck2 runs natively.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docker/**
      - sixmax/**
      - common/**
      - BUCK
      - toolchains/**
      - pyproject.toml
      - .github/workflows/build-trainer-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zfdupont/pokerbot-trainer:latest
