name: build-web-image

# Builds and pushes the pokerbot-web image (FastAPI + compiled sixmax.so) on a
# native amd64 runner, mirroring build-trainer-image.yml (buck2 SIGILLs under
# QEMU on arm64, so the image cannot be built on an Apple Silicon Mac).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - web/**
      - agents/**
      - game/**
      - models/**
      - util/**
      - sixmax/**
      - common/**
      - BUCK
      - toolchains/**
      - .github/workflows/build-web-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/zfdupont/pokerbot-web:latest
